<!DOCTYPE html>
<html>
<head>
  <script>
    // forward everything to redirect.html
    const path = window.location.pathname;

    if (path.startsWith("/c/") || path.startsWith("/u/")) {
      window.location.replace("/redirect.html" + window.location.search);
    } else {
      window.location.replace("/redirect.html");
    }
  </script>
</head>
<body></body>
</html>
