<!DOCTYPE html>
<html>
<head>
  <script>
    const path = window.location.pathname;

    if (path.startsWith('/c/')) {
      const handle = path.slice(3);
      location.replace('/redirect.html?type=channel&handle=' + encodeURIComponent(handle));
    } else if (path.startsWith('/u/')) {
      const handle = path.slice(3);
      location.replace('/redirect.html?type=user&handle=' + encodeURIComponent(handle));
    } else {
      location.replace('/redirect.html');
    }
  </script>
</head>
<body></body>
</html>
