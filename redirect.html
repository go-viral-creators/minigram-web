<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opening Minigram…</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .card {
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 360px;
      width: 90%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }

    .logo {
      width: 72px;
      height: 72px;
      background: rgba(255,255,255,0.2);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 36px;
    }

    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }

    p { font-size: 15px; opacity: 0.85; line-height: 1.5; margin-bottom: 32px; }

    .handle {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      background: rgba(255,255,255,0.18);
      border-radius: 12px;
      padding: 8px 20px;
      display: inline-block;
      margin-bottom: 32px;
      letter-spacing: 0.5px;
    }

    .btn-open {
      display: block;
      background: #fff;
      color: #1a73e8;
      font-size: 16px;
      font-weight: 700;
      border-radius: 14px;
      padding: 16px;
      text-decoration: none;
      margin-bottom: 14px;
      transition: opacity 0.2s;
    }
    .btn-open:active { opacity: 0.8; }

    .btn-store {
      display: block;
      background: rgba(255,255,255,0.15);
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      border-radius: 14px;
      padding: 14px;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn-store:active { opacity: 0.8; }

    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status { font-size: 13px; opacity: 0.7; margin-top: 20px; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">💬</div>
  <h1 id="title">Opening Minigram</h1>
  <div class="spinner" id="spinner"></div>
  <div class="handle" id="handleDisplay">@…</div>
  <p id="desc">Redirecting you to the Minigram app…</p>
  <a id="btnOpen"  class="btn-open"  href="#">Open in Minigram</a>
  <a id="btnStore" class="btn-store" href="https://play.google.com/store/apps/details?id=com.ddcstudio.minigram" target="_blank">
    Get Minigram on Google Play
  </a>
  <p class="status" id="status">Launching app…</p>
</div>

<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var type   = params.get('type');
  var handle = params.get('handle');

  // ✅ FALLBACK (IMPORTANT FIX)
  if (!handle || !type) {
    var path = window.location.pathname;

    if (path.startsWith("/c/")) {
      handle = path.replace("/c/", "");
      type = "channel";
    } else if (path.startsWith("/u/")) {
      handle = path.replace("/u/", "");
      type = "user";
    }
  }

  // ❌ STILL INVALID
  if (!handle || !type) {
    document.getElementById('title').textContent = 'Invalid Link';
    document.getElementById('desc').textContent = 'This link appears to be broken.';
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('btnOpen').style.display = 'none';
    document.getElementById('btnStore').style.display = 'none';
    return;
  }

  var isChannel = type === 'channel';

  document.getElementById('title').textContent = isChannel ? 'Open Channel' : 'Open Chat';
  document.getElementById('handleDisplay').textContent = '@' + handle;

  var deepLink = isChannel
    ? 'minigram://channel/' + handle
    : 'minigram://user/' + handle;

  document.getElementById('btnOpen').href = deepLink;

  setTimeout(function () {
    window.location.href = deepLink;
  }, 600);

})();
</script>
</body>
</html>
