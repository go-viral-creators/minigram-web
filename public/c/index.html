
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Opening Minigram...</title>
  <script>
    function openApp() {
      // handle extract
      const path = window.location.pathname;
      const handle = path.split("/").pop();

      // try open app
      window.location = "minigram://channel/" + handle;

      // fallback (Play Store)
      setTimeout(() => {
        window.location = "https://play.google.com/store/apps/details?id=com.ddcstudio.minigram";
      }, 2000);
    }
  </script>
</head>

<body onload="openApp()">
  <h2>Opening in app...</h2>
</body>
</html>
