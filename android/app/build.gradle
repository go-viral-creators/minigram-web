plugins {
	id 'com.android.application'
}

def ksFile = rootProject.file('keystore.properties')
def ksProps = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }

android {
	compileSdk 36
	
	splits {
		abi {
			enable true
			reset()
			include 'arm64-v8a', 'armeabi-v7a'
			universalApk false
		}
	}

	lint {
		checkReleaseBuilds false
		abortOnError false
	}

	signingConfigs {
		release {
			if (ksFile.exists()) {
				storeFile rootProject.file(ksProps['storeFile'])
				storePassword ksProps['storePassword']
				keyAlias ksProps['keyAlias']
				keyPassword ksProps['keyPassword']
			}
		}
	}

	buildFeatures {
		buildConfig true
		viewBinding true
	}

	defaultConfig {
		applicationId "com.silu.minigram"
		namespace "com.silu.minigram"
		minSdkVersion 23
		targetSdkVersion 36
		versionCode 10
		versionName "1.1.0"
		resConfigs "en", "hi"
		buildConfigField "boolean", "APP_CHECK_DEBUG", project.hasProperty("appCheckDebug") ? "true" : "false"
	}
	
	buildTypes {
		release {
			minifyEnabled true
			shrinkResources true
			// Debug-signed on request (sideload/testing). Replace with a real keystore before Play upload.
			signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
		}
	}
}

dependencies {
	implementation fileTree(dir: 'libs', include: ['*.jar'])
	implementation 'androidx.appcompat:appcompat:1.7.1'
	implementation 'com.google.android.material:material:1.12.0'
	implementation platform('com.google.firebase:firebase-bom:34.1.0')
	implementation 'com.google.firebase:firebase-auth'
	implementation 'com.google.firebase:firebase-database'
	implementation 'com.google.android.gms:play-services-ads:25.4.0'
	implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
	implementation 'com.github.bumptech.glide:glide:4.16.0'
	implementation 'com.google.code.gson:gson:2.11.0'
	implementation 'com.google.firebase:firebase-messaging'
	implementation 'com.github.yalantis:ucrop:2.2.8'
	implementation 'jp.wasabeef:glide-transformations:4.3.0'
	implementation 'com.google.firebase:firebase-functions'
	implementation 'com.google.firebase:firebase-storage'
	implementation 'com.google.firebase:firebase-appcheck-playintegrity'
	// only used when building with -PappCheckDebug=true (side-loaded test builds)
	implementation 'com.google.firebase:firebase-appcheck-debug'
	implementation 'androidx.biometric:biometric:1.1.0'
	implementation 'com.google.mlkit:translate:17.0.3'
	implementation 'com.google.mlkit:language-id:17.0.6'
	implementation 'com.google.crypto.tink:tink-android:1.15.0'
	implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
	testImplementation 'junit:junit:4.13.2'
	implementation 'com.android.billingclient:billing:8.3.0'
}
