<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WeTalks</title>
<meta name="theme-color" content="#1F6FEB">
<meta property="og:title" content="WeTalks"><meta property="og:description" content="Private, end-to-end encrypted messaging with groups and channels.">
<meta property="og:image" content="/assets/img/icon-192.png"><link rel="icon" href="/assets/img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* same palette as the app: primary #1F6FEB, navy text, soft grey surfaces; dark mode uses the app's dark theme */
  :root{--pr:#1F6FEB;--bg:#F4F6FA;--card:#fff;--tx:#0F1B2D;--tx2:#6B7A90;--line:#EEF0F4;--chip:#F1F3F7;--bar:#1F6FEB}
  @media(prefers-color-scheme:dark){:root{--pr:#4F9CFF;--bg:#0E1621;--card:#17212B;--tx:#E8EEF5;--tx2:#8A9BB0;--line:#1F2C3A;--chip:#1B2735;--bar:#17212B}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;min-height:100vh}
  header{background:var(--bar);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 70px;display:flex;align-items:center;gap:10px}
  header img{width:30px;height:30px;border-radius:9px;background:#fff}
  header b{font-weight:700;font-size:18px;letter-spacing:-.01em}
  main{flex:1;padding:0 16px 28px;display:flex;flex-direction:column;align-items:center}
  .card{width:min(100%,420px);margin-top:-48px;background:var(--card);border-radius:20px;padding:0 20px 22px;text-align:center;box-shadow:0 8px 28px rgba(15,27,45,.10);animation:up .35s ease-out both}
  @keyframes up{from{opacity:0;transform:translateY(10px)}}
  .av{width:96px;height:96px;border-radius:50%;margin:-48px auto 12px;border:4px solid var(--card);background:var(--pr);color:#fff;display:grid;place-items:center;font-weight:700;font-size:40px;overflow:hidden;box-shadow:0 2px 10px rgba(15,27,45,.15)}
  .av img{width:100%;height:100%;object-fit:cover;display:block}
  .tag{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--chip);color:var(--tx2);font-size:12px;font-weight:600;margin-bottom:6px}
  h1{margin:2px 0 2px;font-size:22px;font-weight:700;letter-spacing:-.015em;word-break:break-word}
  .sub{color:var(--tx2);font-size:14px;margin:0 0 4px}
  .about{margin:10px 0 0;color:var(--tx);font-size:14px;white-space:pre-wrap;word-break:break-word}
  .meta{margin:10px 0 0;color:var(--tx2);font-size:13px}
  .btn{display:block;margin-top:20px;padding:14px;border-radius:14px;background:var(--pr);color:#fff;text-decoration:none;font-weight:600;font-size:16px;transition:transform .12s,opacity .12s}
  .btn:active{transform:scale(.98);opacity:.92}
  .hint{margin:12px 0 0;color:var(--tx2);font-size:13px;display:none}
  .foot{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);color:var(--tx2);font-size:12px;display:flex;justify-content:center;align-items:center;gap:6px}
  .sk{opacity:.55}
</style></head>
<body>
<header><img src="/assets/img/icon-192.png" alt=""><b>WeTalks</b></header>
<main><section class="card">
  <div class="av" id="av"><img src="/assets/img/icon-192.png" alt=""></div>
  <span class="tag" id="k">Private messenger</span>
  <h1 id="t">WeTalks</h1>
  <div class="sub" id="u"></div>
  <div class="about" id="a"></div>
  <div class="meta" id="m"></div>
  <a class="btn" id="open" href="#">Open in WeTalks</a>
  <div class="hint" id="n"></div>
  <div class="foot"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>End-to-end encrypted messaging</div>
</section></main>
<script>
  var $ = function (i) { return document.getElementById(i); };
  var m = location.pathname.match(/^\/([cu])\/([A-Za-z0-9_]{3,32})/), isAndroid = /android/i.test(navigator.userAgent);
  var q = new URLSearchParams(location.search);
  var DB = 'https://wetalks-78e5a-default-rtdb.firebaseio.com';
  if (!m) { $('open').style.display = 'none'; $('u').textContent = 'Private messaging with groups and channels.'; }
  else {
    var isUser = m[1] === 'u', name = m[2];
    $('k').textContent = isUser ? 'Profile' : 'Channel';
    $('t').textContent = isUser ? '@' + name : name;
    $('open').textContent = isUser ? 'Message on WeTalks' : 'Open channel in WeTalks';
    var initial = function (txt) { var av = $('av'); av.textContent = (txt || name).charAt(0).toUpperCase(); };
    initial();
    // public card (name, photo, bio) - only exists for public profiles / public channels
    fetch(DB + '/web/' + m[1] + '/' + name.toLowerCase() + '.json').then(function (r) { return r.json(); }).then(function (d) {
      if (!d) return;
      $('t').textContent = d.n || $('t').textContent;
      if (isUser) $('u').textContent = '@' + name;
      if (d.a) $('a').textContent = d.a;
      if (!isUser && d.s) $('m').textContent = d.s + (d.s === 1 ? ' follower' : ' followers');
      if (d.p) { var av = $('av'); av.textContent = ''; var im = new Image(); im.alt = ''; im.src = 'data:image/jpeg;base64,' + d.p; av.appendChild(im); } else initial(d.n);
    }).catch(function () {});
    var scheme = 'wetalks://' + m[1] + '/' + name;
    var back = location.origin + location.pathname + '?nr=1';
    var intent = 'intent://' + m[1] + '/' + name + '#Intent;scheme=wetalks;package=com.kafisir.wetalks;S.browser_fallback_url=' + encodeURIComponent(back) + ';end';
    var go = isAndroid ? intent : scheme;
    $('open').href = go;
    var hint = $('n'); hint.style.display = 'block';
    if (!isAndroid) hint.textContent = 'WeTalks is a phone app. Open this link on your Android phone.';
    else if (q.get('nr')) hint.textContent = "Couldn't open the app. Install WeTalks, then tap the button again.";
    else { hint.textContent = 'Tap the button to open this in the app.'; setTimeout(function () { location.href = go; }, 300); }
  }
</script></body></html>
